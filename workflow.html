<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مصمم الوكيل البصري 🔗 مثل n8n - مجاني</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/drawflow@0.0.60/dist/drawflow.min.css">
<style>
:root{--bg:#101014;--panel:#17171c;--line:#2a2a33;--acc:#ea4b71}
body{margin:0;font-family:Segoe UI,Tahoma;background:var(--bg);color:#eee;overflow:hidden}
header{display:flex;gap:6px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px}
header b{font-size:14px;white-space:nowrap}
button{background:#3a3a46;color:#fff;border:1px solid #4a4a58;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc)}
button.ghost{background:transparent}
.small{font-size:11px;color:#999}
#zoomLbl{min-width:44px;text-align:center;font-size:12px;color:#bbb}
#wrap{display:flex;height:calc(100vh - 47px)}
#panel{width:230px;min-width:230px;background:var(--panel);border-left:1px solid var(--line);padding:10px;overflow:auto;transition:margin .2s}
#palette{width:172px;min-width:172px;background:var(--panel);border-right:1px solid var(--line);padding:10px;overflow:auto;transition:margin .2s}
#wrap.hideL #panel{margin-right:-250px}
#wrap.hideR #palette{margin-left:-192px}
#palette select{width:100%;background:#22222b;border:1px solid var(--line);color:#eee;border-radius:8px;padding:7px;margin-bottom:6px;font-size:12px}
.node-btn{display:flex;align-items:center;gap:7px;background:#1e1e25;border:1px solid var(--line);border-radius:8px;padding:5px 7px;margin-bottom:5px;cursor:grab;font-size:11.5px}
.node-btn:hover{border-color:var(--acc)}
.node-btn .ico{width:26px;height:26px;min-width:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
details.cat{margin-bottom:6px}
details.cat summary{cursor:pointer;font-size:12px;color:#bbb;padding:3px;list-style:none}
details.cat summary::-webkit-details-marker{display:none}
details.cat summary:before{content:'▾ '}
#editor{flex:1;position:relative;overflow:hidden;min-width:0}
#draw{width:100%;height:100%}
.drawflow{background:var(--bg)!important;background-image:radial-gradient(#2e2e38 1.1px,transparent 1.1px)!important;background-size:24px 24px!important}
.drawflow svg path{stroke:#8b8fa3!important;stroke-width:2!important}
.drawflow-node{background:#1e1e25!important;border:1px solid #3a3a46!important;border-radius:10px!important;width:132px!important;padding:0!important;box-shadow:0 4px 14px rgba(0,0,0,.45)!important}
.drawflow-node.selected{border-color:var(--acc)!important;box-shadow:0 0 0 2px #ea4b7155!important}
.drawflow-node.AIAgent{width:196px!important}
.n8n{position:relative;padding:10px 8px 8px;text-align:center}
.n8n .ic{width:38px;height:38px;border-radius:9px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;font-weight:bold}
.n8n .lb{font-size:11.5px;font-weight:600;line-height:1.35}
.n8n .lb span{display:block;font-weight:400;font-size:10.5px;color:#a7a7b3}
.n8n .trig{position:absolute;top:-7px;right:-7px;background:#ff6d5a;border-radius:50%;width:17px;height:17px;font-size:10px;display:flex;align-items:center;justify-content:center}
.n8n .dot{position:absolute;bottom:6px;left:8px;width:7px;height:7px;border-radius:50%;background:#35c26e}
.drawflow-node .input,.drawflow-node .output{width:12px!important;height:12px!important;background:#fff!important;border:2px solid #8b8fa3!important}
.drawflow-node .input:hover,.drawflow-node .output:hover{border-color:var(--acc)!important}
#panel input,#panel textarea,#panel select{width:100%;background:#22222b;border:1px solid var(--line);color:#eee;border-radius:8px;padding:7px;margin-bottom:7px;box-sizing:border-box;font-size:13px}
.kbd{background:#2a2a33;border-radius:5px;padding:0 6px;font-size:11px}
</style>
</head>
<body>
<header>
<button class="ghost" id="btnL" onclick="toggleL()" title="إخفاء/إظهار الإعدادات">☰</button>
<b>🔗 المصمم البصري</b>
<span class="small" id="msg">عجلة الفأرة + Ctrl للزوم • اسحب الخلفية للتحريك • <span class="kbd">Del</span> لحذف عقدة</span>
<span style="flex:1"></span>
<button class="ghost" onclick="zoomOut()">−</button>
<span id="zoomLbl">100%</span>
<button class="ghost" onclick="zoomIn()">+</button>
<button class="ghost" onclick="zoomFit()">⤢</button>
<button class="ghost" onclick="exactImage()">↺ الصورة</button>
<button class="ghost" onclick="toggleR()" title="إخفاء/إظهار القائمة">📋</button>
<button onclick="testFlow()">⚡ جرّب</button>
<button class="primary" onclick="save()">💾 حفظ</button>
</header>
<div id="wrap">
<div id="panel">
<b style="font-size:13px">⚙️ إعدادات العقدة</b>
<div class="small">اضغط على أي عقدة</div>
<div style="height:6px"></div>
<label class="small">System Prompt</label>
<textarea id="cfg_prompt" rows="6"></textarea>
<label class="small">Model</label>
<select id="cfg_model"><option>llama-3.3-70b-versatile</option><option>llama-3.1-8b-instant</option><option>mixtral-8x7b-32768</option></select>
<label class="small">اسم المتجر</label>
<input id="cfg_biz">
<button onclick="applyCfg()" style="width:100%">تطبيق ✅</button>
<div class="small" id="testOut" style="margin-top:8px;white-space:pre-wrap"></div>
<div style="height:10px"></div>
<div class="small">روابط Webhook:</div>
<div class="small" id="hooks" style="direction:ltr;text-align:left"></div>
</div>
<div id="editor" ondragover="event.preventDefault()" ondrop="drop(event)"><div id="draw"></div></div>
<div id="palette">
<label class="small">➕ أضف عقدة</label>
<select id="nodePick">
<option value="ExecTrigger">↩️ Execute Workflow Trigger</option>
<option value="ChatTrigger">💬 When chat message received</option>
<option value="AIAgent">🤖 AI Agent</option>
<option value="AnthropicModel">AI Anthropic Chat Model</option>
<option value="WhatsAppSend">💬 WhatsApp Send</option>
<option value="GoogleSheets">📊 Google Sheets</option>
<option value="GmailSend">📧 Gmail Send</option>
<option value="HttpRequest">🌐 HTTP Request</option>
<option value="EditFields">✏️ Edit Fields</option>
<option value="TelegramTrigger">📩 Telegram Trigger</option>
<option value="FacebookTrigger">📘 Facebook Trigger</option>
<option value="GroqModel">🧠 Groq Model</option>
<option value="Memory">💾 Memory</option>
<option value="Calculator">🔢 Calculator</option>
<option value="Wikipedia">📚 Wikipedia</option>
<option value="TelegramSend">📤 Telegram Send</option>
</select>
<button onclick="addPicked()" style="width:100%">إضافة ➕</button>
<div style="height:6px"></div>
<details class="cat" open><summary>المشغلات</summary><div id="catTrig"></div></details>
<details class="cat" open><summary>الذكاء</summary><div id="catAI"></div></details>
<details class="cat" open><summary>الأدوات</summary><div id="catTools"></div></details>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/drawflow@0.0.60/dist/drawflow.min.js"></script>
<script>
const el = document.getElementById('draw');
const editor = new Drawflow(el);
editor.reroute = true;
editor.zoom_max = 1.8; editor.zoom_min = 0.25; editor.zoom_value = 0.08;
editor.start();
// بناء القوائم بأيقونات صغيرة ملونة
const CATS = {
  catTrig:[['ExecTrigger','↩️','Execute','#e85d4d'],['ChatTrigger','💬','Chat msg','#6b7280'],['TelegramTrigger','📩','Telegram','#229ED9'],['FacebookTrigger','📘','Facebook','#1877F2']],
  catAI:[['AIAgent','🤖','Agent','#ea4b71'],['AnthropicModel','AI','Anthropic','#d97757'],['GroqModel','🧠','Groq','#22c55e'],['Memory','💾','Memory','#6b7280']],
  catTools:[['Calculator','🔢','Calc','#6b7280'],['Wikipedia','📚','Wiki','#6b7280'],['EditFields','✏️','Edit','#8b5cf6'],['WhatsAppSend','💬','WhatsApp','#25D366'],['GoogleSheets','📊','Sheets','#22c55e'],['GmailSend','📧','Gmail','#e85d4d'],['HttpRequest','🌐','HTTP','#6b7280'],['TelegramSend','📤','Send','#229ED9']]
};
for(const [cid,items] of Object.entries(CATS)){
  document.getElementById(cid).innerHTML = items.map(([t,i,l,c])=>
    `<div class="node-btn" draggable="true" ondragstart="drag(event,'${t}')"><span class="ico" style="background:${c}">${i}</span>${l}</div>`).join('');
}
let dragType = null;
function drag(ev, t){ dragType = t; }
function addPicked(){ addNode(document.getElementById('nodePick').value, 220+Math.random()*220, 130+Math.random()*140); }
el.parentElement.addEventListener('drop', drop);
function drop(ev){ ev.preventDefault(); if(!dragType) return;
  const r = el.getBoundingClientRect();
  addNode(dragType, ev.clientX-r.left, ev.clientY-r.top); dragType = null; }
const ICON = {ExecTrigger:['↩️','#e85d4d',1],ChatTrigger:['💬','#4b5563',1],TelegramTrigger:['📩','#229ED9',1],FacebookTrigger:['📘','#1877F2',1],AIAgent:['🤖','#2a2a33',0],AnthropicModel:['AI','#d97757',0],GroqModel:['🧠','#14532d',0],Memory:['💾','#374151',0],Calculator:['🔢','#374151',0],Wikipedia:['📚','#374151',0],EditFields:['✏️','#5b21b6',0],WhatsAppSend:['💬','#128C7E',0],GoogleSheets:['📊','#166534',0],GmailSend:['📧','#b91c1c',0],HttpRequest:['🌐','#374151',0],TelegramSend:['📤','#229ED9',0]};
const SUB = {ExecTrigger:'Trigger',ChatTrigger:'When chat message|received',AIAgent:'AI Agent|Conversational Agent',AnthropicModel:'Anthropic|Chat Model',EditFields:'Edit Fields|manual'};
function addNode(type, x, y){
  const ins = (type==='AIAgent')?2:((type==='TelegramSend')?1:((/Trigger/.test(type)||/Model|Memory|Calculator|Wikipedia/.test(type))?(type==='AIAgent'?2:0):1));
  const outs = (/Send|EditFields|Sheets|Gmail|HttpRequest/.test(type)&&type!=='EditFields')?1:(type==='TelegramSend'?0:1);
  const o = (type==='TelegramSend')?0:1;
  const i = (type==='AIAgent')?3:(/Trigger$/.test(type)||/Model$/.test(type)||type==='Memory'||type==='Calculator'||type==='Wikipedia'?0:1);
  const [ic,bg,trig] = ICON[type]||['⬢','#374151',0];
  const nm = document.getElementById('nodePick').selectedOptions ? type : type;
  const label = (SUB[type]||type).split('|');
  const html = `<div class="n8n"><div class="ic" style="background:${bg}">${ic}</div><div class="lb">${label[0]}${label[1]?`<span>${label[1]}</span>`:''}</div>${trig?'<div class="trig">⚡</div>':''}<div class="dot"></div></div>`;
  return editor.addNode(type, i, o, x, y, type, {prompt:'',model:'llama-3.3-70b-versatile',biz:''}, html);
}
let selId = null;
editor.on('nodeSelected', id=>{ selId=id; try{ const n=editor.getNodeFromId(id); document.getElementById('cfg_prompt').value=n.data.prompt||''; document.getElementById('cfg_model').value=n.data.model||'llama-3.3-70b-versatile'; }catch(e){} });
document.addEventListener('keydown', e=>{ if((e.key==='Delete'||e.key==='Backspace')&&selId&&document.activeElement.tagName!=='TEXTAREA'&&document.activeElement.tagName!=='INPUT'){ editor.removeNodeId('node-'+selId); selId=null; } });
function applyCfg(){ if(!selId) return alert('اضغط على عقدة AI Agent أولا');
  const n=editor.getNodeFromId(selId);
  n.data.prompt=document.getElementById('cfg_prompt').value; n.data.model=document.getElementById('cfg_model').value; n.data.biz=document.getElementById('cfg_biz').value;
  editor.updateNodeDataFromId(selId,n.data); msg('✅ تحفظ في العقدة'); }
function msg(t){ document.getElementById('msg').textContent=t; }
// زوم + إخفاء
function updateZoom(){ try{ const m=editor.precanvas.style.transform.match(/scale\(([\d.]+)\)/); document.getElementById('zoomLbl').textContent=Math.round(parseFloat(m?m[1]:1)*100)+'%'; }catch(e){} }
function zoomIn(){ editor.zoom_in(); updateZoom(); }
function zoomOut(){ editor.zoom_out(); updateZoom(); }
function zoomFit(){ editor.zoom_reset(); updateZoom(); }
el.addEventListener('wheel', e=>{ if(e.ctrlKey||e.metaKey){ e.preventDefault(); e.deltaY<0?editor.zoom_in():editor.zoom_out(); updateZoom(); } }, {passive:false});
function toggleL(){ document.getElementById('wrap').classList.toggle('hideL'); }
function toggleR(){ document.getElementById('wrap').classList.toggle('hideR'); }
// قالب مطابق للصورة
function defaultFlow(){ try{ const h=editor.drawflow.drawflow.Home; if(h&&Object.keys(h.data||{}).length) return; }catch(e){} exactImage(); }
function exactImage(){ try{ editor.clear(); }catch(e){}
  const idExec=addNode('ExecTrigger',60,90), idChat=addNode('ChatTrigger',150,230),
        idAI=addNode('AIAgent',430,95), idModel=addNode('AnthropicModel',495,320),
        idEdit=addNode('EditFields',800,95);
  try{ editor.addConnection(idExec,idAI,'output_1','input_1'); editor.addConnection(idChat,idAI,'output_1','input_2');
       editor.addConnection(idModel,idAI,'output_1','input_3'); editor.addConnection(idAI,idEdit,'output_1','input_1');
       editor.zoom_refresh(); updateZoom(); }catch(e){} }
async function save(){ const data=editor.export();
  const nodes=Object.values(data.drawflow.Home.data); const ai=nodes.find(n=>n.name==='AIAgent');
  const payload={draw:data,prompt:(ai&&ai.data.prompt)||'',model:(ai&&ai.data.model)||'llama-3.3-70b-versatile',biz:document.getElementById('cfg_biz').value||''};
  const r=await fetch('/api/workflow',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(r=>r.json());
  msg(r.ok?'✅ تحفظ ويشتغل الآن':'❌ خطأ'); }
async function load(){ try{ const r=await fetch('/api/workflow').then(r=>r.json());
  if(r&&r.draw){ editor.import(r.draw); if(r.prompt)document.getElementById('cfg_prompt').value=r.prompt; if(r.model)document.getElementById('cfg_model').value=r.model; if(r.biz)document.getElementById('cfg_biz').value=r.biz; updateZoom(); return; } }catch(e){} defaultFlow(); }
async function testFlow(){ const q=prompt('رسالة زبون للتجربة:','شحال السعر؟')||'شحال السعر؟';
  const r=await fetch('/test?q='+encodeURIComponent(q)).then(r=>r.json());
  document.getElementById('testOut').textContent='🤖 '+r.reply; }
load();
setTimeout(()=>{ try{ const h=editor.drawflow.drawflow.Home; if(!Object.keys(h.data||{}).length) defaultFlow(); updateZoom(); }catch(e){} },600);
document.getElementById('hooks').textContent=location.origin+'/webhook/meta';
fetch('/api/knowledge').then(r=>r.json()).then(k=>{ if(k&&k.business_name)document.getElementById('cfg_biz').value=k.business_name; }).catch(()=>{});
</script>
</body>
</html>
